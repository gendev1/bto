[project]
name = "bto"
version = "0.1.0"
description = "Broadcast Tactical Overlay - TV telestrator (SPEC.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
