[project]
name = "bto"
version = "0.1.0"
description = "Broadcast Tactical Overlay - TV telestrator (SPEC.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "ultralytics>=8.4.84",
    "supervision>=0.29.1",
    "opencv-python>=5.0.0.93",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.49.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
